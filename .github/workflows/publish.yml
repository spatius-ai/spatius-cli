name: Release CLI and media Worker

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: production-release
  queue: max
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      tag: ${{ steps.release.outputs.tag }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate release and set version from tag
        id: release
        run: node scripts/prepare-release.mjs

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install completion test shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Run all checks
        run: pnpm check

      - name: Pack and test the exact release artifact
        run: pnpm package:check -- --artifact-dir "$RUNNER_TEMP/release"

      - name: Preserve validated npm artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release/*.tgz
            ${{ runner.temp }}/release/release-artifact.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy production media Worker
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version_id: ${{ steps.health.outputs.version_id }}
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Repeat preflight so rerunning a failed job cannot deploy an already published version.
      - name: Recheck release eligibility
        run: node scripts/prepare-release.mjs

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy production Worker
        id: worker
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is required"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is required"; exit 1; }
          pnpm --filter @spatius/media-worker exec wrangler deploy --env production --tag "$RELEASE_TAG" --message "$RELEASE_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/worker-deployment.ndjson
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}

      - name: Verify production deployment
        id: health
        run: node scripts/check-deployment.mjs "$RUNNER_TEMP/worker-deployment.ndjson"

      - name: Report deployment failure
        if: failure()
        run: |
          echo "Worker deployment or verification failed. npm publication was blocked. Inspect the Cloudflare deployment before retrying; no automatic rollback was attempted." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish npm package
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Recheck release eligibility
        run: node scripts/prepare-release.mjs

      - name: Download the validated npm artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Verify artifact integrity and version
        id: artifact
        run: node scripts/verify-release-artifact.mjs "$RUNNER_TEMP/release" "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}

      # The tarball was built and installed in the build job. Never rebuild it here.
      - name: Publish with npm trusted publishing
        run: npm publish "$RELEASE_TARBALL" --ignore-scripts --tag "$NPM_DIST_TAG" --access public --provenance
        env:
          RELEASE_TARBALL: ${{ steps.artifact.outputs.tarball }}
          NPM_DIST_TAG: ${{ needs.build.outputs.dist_tag }}

      - name: Report release
        run: |
          {
            echo "Published @spatius/cli@$RELEASE_VERSION to npm tag $NPM_DIST_TAG."
            echo ""
            echo "Production Worker version: $WORKER_VERSION"
            echo ""
            echo "Endpoint: https://cli-media.spatius.ai"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          NPM_DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          WORKER_VERSION: ${{ needs.deploy.outputs.version_id }}

      - name: Report partial release
        if: failure()
        run: |
          {
            echo "The production Worker was deployed, but npm publication did not complete successfully."
            echo "Worker version: $WORKER_VERSION"
            echo "Check npm for @spatius/cli@$RELEASE_VERSION before retrying. No automatic rollback or npm publication retry was attempted."
            echo "If a newer release has deployed, fix forward with a new version instead of rerunning this release."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          WORKER_VERSION: ${{ needs.deploy.outputs.version_id }}
